services:
  postgres:
    image: postgres:16-alpine
    container_name: aluga-crajubar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aluga_crajubar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
